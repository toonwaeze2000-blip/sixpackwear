<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Catalog</title><style>:root{--bg:#050505;--panel:#0b0b0b;--text:#f4f4f0;--muted:#888;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;background:rgba(5,5,5,.94);backdrop-filter:blur(8px);z-index:5}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo span{font-weight:300;color:#aaa}.nav{display:flex;gap:28px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.nav a:hover{color:#fff}.wrap{max-width:1500px;margin:auto;padding:56px 34px 90px}.catalogHead{display:flex;justify-content:space-between;gap:30px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:26px}.kicker{font-size:10px;color:#777;letter-spacing:.24em;text-transform:uppercase}.catalogHead h1{font-size:clamp(42px,6vw,84px);line-height:.85;letter-spacing:-.06em;text-transform:uppercase;margin:10px 0 0}.catalogTools{display:flex;gap:8px;min-width:min(520px,45vw)}.catalogTools input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:13px}.catalogTools button{background:#f0f0eb;color:#050505;border:0;padding:0 18px;font-size:10px;font-weight:800;letter-spacing:.12em}.catalogStatus{padding:20px 0;color:#777;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.productGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.pcard{background:var(--panel);border:1px solid var(--line);transition:transform .18s ease,border-color .18s ease}.pcard:hover{transform:translateY(-3px);border-color:#555}.pimage{aspect-ratio:3/4;overflow:hidden;background:#111}.pimage img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}.pmeta{padding:15px}.pbrand{font-size:9px;color:#777;letter-spacing:.16em}.pcard h3{font-size:18px;margin:8px 0 4px}.psub{font-size:11px;color:#777}.prow{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.prow strong{font-size:14px}.prow span{font-size:8px;letter-spacing:.12em;color:#888}.empty{padding:70px 0;color:#777}.productGrid:has(.empty){display:block}@media(max-width:900px){.catalogHead{display:block}.catalogTools{margin-top:22px;min-width:0}.productGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.nav{display:none}.wrap{padding:40px 16px 60px}.productGrid{grid-template-columns:1fr}.catalogHead h1{font-size:54px}}</style></head><body><header><a class="logo" href="/">6PACK<span>WEAR</span></a><nav class="nav"><a href="/catalog.html?view=looks">Looks</a><a href="/catalog.html?view=categories">Categories</a><a href="/catalog.html?view=brands">Brands</a><a href="/catalog.html?view=newdrops">New Drops</a><a href="/">Home</a></nav></header><main class="wrap"><div id="catalogApp"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/catalog.js"></script></body></html>
