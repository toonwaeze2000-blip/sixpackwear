<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Brands</title><link rel="stylesheet" href="/catalog.css"><style>.brandGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.status{color:#777;font-size:11px;margin:18px 0}.toolbar{display:flex;gap:10px;align-items:center}.searchBox{flex:1}@media(max-width:800px){.brandGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.brandGrid{grid-template-columns:1fr}}</style></head><body><header class="siteHeader"><nav class="nav"><a class="logo" href="/">6PACK<span>WEAR</span></a><div class="navlinks"><a href="/looks.html">Looks</a><a href="/categories.html">Categories</a><a class="active" href="/brands.html">Brands</a><a href="/new-drops.html">New Drops</a><a href="/my-look.html">My Look</a></div></nav></header><main class="wrap"><a class="back" href="/">← Back to home</a><div class="kicker">Selected labels</div><h1 class="title">Brands</h1><p class="intro">Every brand currently added to the 6PACKWEAR catalog appears here automatically.</p><div class="toolbar"><input class="searchBox" id="search" placeholder="Search brands..."><div class="count" id="count"></div></div><div class="status" id="status">Loading brands…</div><section class="brandGrid" id="grid"></section></main><footer class="footer"><div><b>6PACKWEAR</b> · STYLE BEYOND LIMITS</div><div>WORLDWIDE SHIPPING · SECURE PAYMENTS · JOIN THE COMMUNITY</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://boaqzdyfsosswqvjgsjn.supabase.co','sb_publishable_JlneB01f5LDJ4VBO_n1E7Q_jXn5JBky');const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),status=document.getElementById('status');let brands=[];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function load(){const {data,error}=await db.from('products').select('brand').not('brand','is',null).order('brand');if(error){status.textContent='Unable to load brands right now.';return}brands=[...new Set((data||[]).map(x=>x.brand).filter(Boolean))];render()}function render(){const q=search.value.trim().toLowerCase();const list=brands.filter(b=>b.toLowerCase().includes(q));count.textContent=list.length+' brand'+(list.length===1?'':'s');status.textContent=list.length?`${list.length} BRANDS`:'No brands yet. Add a product with a brand and it will appear here automatically.';grid.innerHTML=list.map(b=>`<a class="card" href="/category.html?brand=${encodeURIComponent(b)}"><div><div class="cardTitle">${esc(b)}</div><div class="cardMeta">View all ${esc(b)} products and latest drops.</div></div><div class="arrow">→</div></a>`).join('')}search.oninput=render;load();</script></body></html>
