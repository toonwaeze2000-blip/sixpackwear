<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Bag</title><style>:root{--bg:#050505;--text:#f4f4f0;--muted:#888;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;background:rgba(5,5,5,.94);backdrop-filter:blur(8px);z-index:5}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo span{font-weight:300;color:#aaa}.nav{display:flex;gap:28px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.wrap{max-width:1100px;margin:auto;padding:55px 34px 90px}.back{display:inline-block;color:#888;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:24px}.kicker{font-size:10px;color:#777;letter-spacing:.24em;text-transform:uppercase}.title{font-size:clamp(48px,7vw,90px);line-height:.9;letter-spacing:-.06em;text-transform:uppercase;margin:12px 0 35px}.cartGrid{display:grid;gap:12px}.item{display:grid;grid-template-columns:100px 1fr auto;gap:20px;align-items:center;border-top:1px solid var(--line);padding:18px 0}.thumb{width:100px;height:120px;background:#111;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-size:17px;text-transform:uppercase}.meta{font-size:11px;color:#777;margin-top:7px}.price{font-size:16px}.qty{display:flex;gap:8px;align-items:center;margin-top:14px}.qty button{width:30px;height:30px;background:none;border:1px solid #444;color:#fff;cursor:pointer}.remove{margin-top:10px;background:none;border:0;color:#777;padding:0;font-size:9px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.summary{margin-top:35px;border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;align-items:center}.total{font-size:26px}.checkout{background:#f0f0eb;color:#050505;border:0;padding:15px 18px;font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}.empty{border:1px solid var(--line);padding:40px;color:#888}@media(max-width:700px){.nav{display:none}.wrap{padding:40px 16px 60px}.item{grid-template-columns:70px 1fr}.thumb{width:70px;height:90px}.price{grid-column:2}.summary{display:block}.checkout{width:100%;margin-top:16px}}</style></head><body><header><a class="logo" href="/">6PACK<span>WEAR</span></a><nav class="nav"><a href="/looks.html">Looks</a><a href="/categories.html">Categories</a><a href="/brands.html">Brands</a><a href="/new-drops.html">New Drops</a><a href="/my-look.html">My Look</a></nav></header><main class="wrap"><a class="back" href="/">← Back to home</a><div class="kicker">Your selection</div><h1 class="title">Bag</h1><div id="app">Loading bag…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/cart.js"></script><script>const fallback='/assets/d2060b27-276c-44c6-89d1-860f5908fb0b.png';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function render(){const app=document.getElementById('app');const cart=await window.sixpackCart.getCart();if(!cart.length){app.innerHTML='<div class="empty">Your bag is empty.<br><br><a href="/brands.html">CONTINUE SHOPPING →</a></div>';return}let total=0;app.innerHTML='<div class="cartGrid">'+cart.map((x,i)=>{const p=x.product||x.products;const line=Number(p?.price||0)*Number(x.quantity||1);total+=line;return `<article class="item"><div class="thumb"><img src="${esc(p?.image||fallback)}" alt="${esc(p?.name||'Product')}"></div><div><div class="name">${esc(p?.name||'Product')}</div><div class="meta">${esc(p?.brand||'6PACKWEAR')} · ${esc(x.size||'One size')}</div><div class="qty"><button data-q="dec" data-i="${i}">−</button><span>${x.quantity}</span><button data-q="inc" data-i="${i}">+</button></div><button class="remove" data-remove="${i}">Remove</button></div><div class="price">$${line.toFixed(2)}</div></article>`}).join('')+'</div><div class="summary"><div><div class="meta">Subtotal</div><div class="total">$'+total.toFixed(2)+'</div></div><button class="checkout" id="checkout">Checkout</button></div>';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{const i=Number(b.dataset.i),x=cart[i];await window.sixpackCart.changeQty(x.product_id,x.size,Math.max(1,x.quantity+(b.dataset.q==='inc'?1:-1)));render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{const x=cart[Number(b.dataset.remove)];await window.sixpackCart.removeFromCart(x.product_id,x.size);render()});document.getElementById('checkout').onclick=()=>{location.href='/checkout.html'}}render();</script></body></html>
