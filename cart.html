<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Bag</title><style>:root{--bg:#050505;--panel:#0b0b0b;--text:#f4f4f0;--muted:#858585;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.top{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4vw;gap:26px;position:sticky;top:0;background:rgba(5,5,5,.96);backdrop-filter:blur(10px);z-index:10}.logo{font-size:25px;font-weight:900;letter-spacing:-.08em;white-space:nowrap}.gender{height:78px;display:flex;align-items:center}.gender span{height:100%;display:flex;align-items:center;padding:0 24px;background:#f4f4f0;color:#050505;font-size:11px;font-weight:900;letter-spacing:.16em}.search{flex:1;max-width:700px}.search input{width:100%;height:44px;border:0;border-radius:24px;padding:0 20px;background:#f1f1ec;color:#111;outline:0}.actions{display:flex;gap:18px;margin-left:auto}.actions button{border:0;background:none;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.wrap{max-width:1180px;margin:auto;padding:52px 34px 100px}.back{display:inline-block;color:#777;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:24px}.kicker{font-size:10px;color:#777;letter-spacing:.24em;text-transform:uppercase}.title{font-size:clamp(52px,7vw,92px);line-height:.84;letter-spacing:-.07em;text-transform:uppercase;margin:10px 0 35px}.section{margin-top:42px}.sectionHead{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}.sectionHead h2{margin:0;font-size:18px;text-transform:uppercase;letter-spacing:.08em}.sectionHead span{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.14em}.cartGrid{display:grid;gap:0}.item{display:grid;grid-template-columns:100px 1fr auto;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:18px 0}.thumb{width:100px;height:120px;background:#111;overflow:hidden;border:1px solid #202020}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-size:16px;text-transform:uppercase}.meta{font-size:10px;color:#777;margin-top:7px}.price{font-size:15px}.qty{display:flex;gap:8px;align-items:center;margin-top:12px}.qty button{width:30px;height:30px;background:#090909;border:1px solid #444;color:#fff}.remove{margin-top:9px;background:none;border:0;color:#777;padding:0;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.summary{margin-top:25px;border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;align-items:center}.total{font-size:27px}.checkout{background:#f0f0eb;color:#050505;border:0;padding:15px 20px;font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.savedGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.savedCard{background:var(--panel);border:1px solid #202020}.savedImage{position:relative;aspect-ratio:3/4;background:#111;overflow:hidden}.savedImage img{width:100%;height:100%;object-fit:cover;display:block}.heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border:1px solid #444;border-radius:50%;background:rgba(5,5,5,.86);color:#fff;font-size:17px}.savedBody{padding:13px}.savedBrand{font-size:8px;color:#777;text-transform:uppercase;letter-spacing:.14em}.savedName{font-size:12px;line-height:1.3;margin:6px 0}.savedPrice{font-size:11px;font-weight:700}.savedActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.savedActions button{height:34px;border:1px solid #3b3b3b;background:#090909;color:#fff;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.savedActions .addSaved{background:#eee;color:#050505}.empty{border:1px solid var(--line);padding:40px;color:#888;line-height:1.6}.empty a{color:#ddd;text-decoration:underline;text-underline-offset:5px}.footerNav{margin-top:70px;padding-top:25px;border-top:1px solid var(--line);display:flex;gap:25px;flex-wrap:wrap}.footerNav a{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.13em}.footerNav a:hover{color:#fff}@media(max-width:800px){.gender{display:none}.actions{gap:9px}.search{display:none}.savedGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{padding:0 14px;height:64px}.wrap{padding:38px 14px 70px}.title{font-size:56px}.item{grid-template-columns:70px 1fr;gap:12px}.thumb{width:70px;height:90px}.price{grid-column:2}.summary{display:block}.checkout{width:100%;margin-top:16px}}@media(max-width:430px){.savedGrid{grid-template-columns:1fr 1fr}.savedActions{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="/">6PACKWEAR</a><div class="gender"><span>MEN</span></div><div class="search"><input id="search" placeholder="Search men's items and brands"></div><div class="actions"><button id="savedBtn">Saved ♡ <span id="savedCount"></span></button><button id="bagBtn">Bag <span id="bagCount">0</span></button></div></header><main class="wrap"><a class="back" href="/">← Back to home</a><div class="kicker">Your selection</div><h1 class="title">Bag</h1><div id="app">Loading bag…</div><div class="section"><div class="sectionHead"><h2>Saved for later</h2><span id="savedLabel">0 saved</span></div><div id="savedApp">Loading saved items…</div></div><nav class="footerNav"><a href="/catalog.html">Shop all</a><a href="/catalog.html?view=looks">Looks</a><a href="/my-look.html">My Look</a><a href="/">Home</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/cart.js?v=20260907-3"></script><script>const SUPABASE_URL='https://boaqzdyfsosswqvjgsjn.supabase.co';const SUPABASE_KEY='sb_publishable_'+'JlneB01f5LDJ4VBO_n1E7Q_jXn5JBky';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const fallback='/assets/d2060b27-276c-44c6-89d1-860f5908fb0b.png';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>'$'+Number(n||0).toFixed(2);const savedIds=()=>{try{return JSON.parse(localStorage.getItem('6pw-saved')||'[]')}catch{return[]}};function syncSavedCount(){const n=savedIds().length;document.getElementById('savedCount').textContent=n?`(${n})`:'';document.getElementById('savedLabel').textContent=`${n} saved`}
async function renderBag(){const app=document.getElementById('app');try{const cart=await window.sixpackCart.getCart();const count=cart.reduce((n,x)=>n+Number(x.quantity||1),0);document.getElementById('bagCount').textContent=count;if(!cart.length){app.innerHTML='<div class="empty">Your bag is empty.<br><br><a href="/catalog.html">CONTINUE SHOPPING →</a></div>';return}let total=0;app.innerHTML='<div class="cartGrid">'+cart.map((x,i)=>{const p=x.product||x.products||{};const line=Number(p.price||0)*Number(x.quantity||1);total+=line;return `<article class="item"><a class="thumb" href="/product.html?id=${encodeURIComponent(p.id||x.product_id)}"><img src="${esc(p.image||fallback)}" alt="${esc(p.name||'Product')}"></a><div><a class="name" href="/product.html?id=${encodeURIComponent(p.id||x.product_id)}">${esc(p.name||'Product')}</a><div class="meta">${esc(p.brand||'6PACKWEAR')} · ${esc(x.size||'One size')}</div><div class="qty"><button data-q="dec" data-i="${i}">−</button><span>${x.quantity}</span><button data-q="inc" data-i="${i}">+</button></div><button class="remove" data-remove="${i}">Remove</button></div><div class="price">${money(line)}</div></article>`}).join('')+'</div><div class="summary"><div><div class="meta">Subtotal</div><div class="total">${money(total)}</div></div><button class="checkout" id="checkout">Checkout</button></div>';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{const x=cart[Number(b.dataset.i)];await window.sixpackCart.changeQty(x.product_id,x.size,Math.max(1,Number(x.quantity||1)+(b.dataset.q==='inc'?1:-1)));renderBag()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{const x=cart[Number(b.dataset.remove)];await window.sixpackCart.removeFromCart(x.product_id,x.size);renderBag()});document.getElementById('checkout').onclick=()=>location.href='/checkout.html'}catch(e){app.innerHTML='<div class="empty">Could not load your bag right now.<br><br><a href="/catalog.html">CONTINUE SHOPPING →</a></div>'}}
async function renderSaved(){const ids=savedIds();syncSavedCount();const box=document.getElementById('savedApp');if(!ids.length){box.innerHTML='<div class="empty">No saved items yet. Tap ♡ on any product to save it.</div>';return}const r=await db.from('products').select('id,name,brand,category,price,image,stock').in('id',ids);if(r.error){box.innerHTML='<div class="empty">Saved items could not be loaded.</div>';return}const byId=new Map((r.data||[]).map(p=>[String(p.id),p]));const list=ids.map(id=>byId.get(String(id))).filter(Boolean);if(!list.length){box.innerHTML='<div class="empty">No saved items yet. Tap ♡ on any product to save it.</div>';return}box.innerHTML='<div class="savedGrid">'+list.map(p=>`<article class="savedCard"><a href="/product.html?id=${encodeURIComponent(p.id)}"><div class="savedImage"><button class="heart" data-unsave="${esc(p.id)}" type="button">♥</button><img src="${esc(p.image||fallback)}" alt="${esc(p.name||'Product')}"></div></a><div class="savedBody"><div class="savedBrand">${esc(p.brand||'6PACKWEAR')}</div><div class="savedName">${esc(p.name||'Product')}</div><div class="savedPrice">${money(p.price)}</div><div class="savedActions"><button class="addSaved" data-saved-add="${esc(p.id)}">Add to bag</button><button data-unsave="${esc(p.id)}">Remove</button></div></div></article>`).join('')+'</div>';box.querySelectorAll('[data-unsave]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const id=String(b.dataset.unsave);const next=savedIds().filter(x=>String(x)!==id);localStorage.setItem('6pw-saved',JSON.stringify(next));renderSaved()});box.querySelectorAll('[data-saved-add]').forEach(b=>b.onclick=async e=>{e.preventDefault();e.stopPropagation();const p=list.find(x=>String(x.id)===String(b.dataset.savedAdd));if(!p)return;await window.sixpackCart.addToCart(p,'',1);await renderBag()})}
document.getElementById('savedBtn').onclick=()=>{document.getElementById('savedApp').scrollIntoView({behavior:'smooth',block:'start'})};document.getElementById('bagBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())location.href='/catalog.html?view=search&q='+encodeURIComponent(e.target.value.trim())};renderBag();renderSaved();</script></body></html>
