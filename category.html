<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Catalog</title><link rel="stylesheet" href="/catalog.css"></head><body><header class="siteHeader"><nav class="nav"><a class="logo" href="/">6PACK<span>WEAR</span></a><div class="navlinks"><a href="/looks.html">Looks</a><a href="/categories.html">Categories</a><a href="/brands.html">Brands</a><a href="/new-drops.html">New Drops</a><a href="/my-look.html">My Look</a></div></nav></header><main class="wrap"><a class="back" href="javascript:history.back()">← Back</a><div class="kicker">6PACKWEAR catalog</div><h1 class="title" id="title">Catalog</h1><p class="intro">Products for the selected brand, category or drop. This page is ready to become data-driven as you add inventory.</p><div class="toolbar"><input class="searchBox" id="search" placeholder="Search products..."><div class="count" id="count"></div></div><section class="productGrid" id="grid"></section></main><footer class="footer"><div><b>6PACKWEAR</b> · STYLE BEYOND LIMITS</div><div>WORLDWIDE SHIPPING · SECURE PAYMENTS · JOIN THE COMMUNITY</div></footer><script>const p=new URLSearchParams(location.search);const selected=p.get('brand')||p.get('category')||p.get('drop')||'Catalog';document.getElementById('title').textContent=selected;const products=['Essential Overshirt','Urban Runner','Technical Shell','Core Hoodie','Logo Cap','Straight Trousers','Street Sneaker','Utility Bag'];const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count');function render(){const q=search.value.trim().toLowerCase();const list=products.filter(x=>x.toLowerCase().includes(q));count.textContent=list.length+' items';grid.innerHTML=list.map((x,i)=>`<article class="product"><div class="productImg"><img src="/assets/d2060b27-276c-44c6-89d1-860f5908fb0b.png" alt="${x}"></div><div class="productInfo"><div class="brand">${selected.toUpperCase()}</div><h3>${x}</h3><div class="meta">Selected men's piece · available soon</div><div class="price"><span>$${[120,180,240,95,45,110,160,85][i]}</span><button class="add">ADD TO BAG</button></div></div></article>`).join('')}search.oninput=render;render();</script></body></html>
