<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Catalog</title><link rel="stylesheet" href="/catalog.css"></head><body><header class="siteHeader"><nav class="nav"><a class="logo" href="/">6PACK<span>WEAR</span></a><div class="navlinks"><a href="/looks.html">Looks</a><a href="/categories.html">Categories</a><a href="/brands.html">Brands</a><a href="/new-drops.html">New Drops</a><a href="/my-look.html">My Look</a></div></nav></header><main class="wrap"><a class="back" href="/">← Back to home</a><div class="kicker">6PACKWEAR catalog</div><h1 class="title" id="title">Catalog</h1><p class="intro">Products for the selected brand, category or drop. Every product comes from the shared 6PACKWEAR catalog.</p><div class="toolbar"><input class="searchBox" id="search" placeholder="Search products..."><div class="count" id="count"></div></div><section class="productGrid" id="grid"></section></main><footer class="footer"><div><b>6PACKWEAR</b> · STYLE BEYOND LIMITS</div><div>WORLDWIDE SHIPPING · SECURE PAYMENTS · JOIN THE COMMUNITY</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://boaqzdyfsosswqvjgsjn.supabase.co','sb_publishable_JlneB01f5LDJ4VBO_n1E7Q_jXn5JBky');const p=new URLSearchParams(location.search);const brand=p.get('brand'),category=p.get('category'),drop=p.get('drop');const selected=brand||category||drop||'Catalog';document.getElementById('title').textContent=selected;const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count');const fallback='/assets/d2060b27-276c-44c6-89d1-860f5908fb0b.png';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let products=[];async function load(){let q=db.from('products').select('*').order('created_at',{ascending:false});if(brand)q=q.ilike('brand',brand);if(category)q=q.ilike('category',category);const {data,error}=await q;if(error){count.textContent='Catalog unavailable';return}products=data||[];render()}function render(){const term=search.value.trim().toLowerCase();const list=products.filter(x=>[x.name,x.brand,x.category,x.style,x.color].some(v=>String(v||'').toLowerCase().includes(term)));count.textContent=list.length+' items';grid.innerHTML=list.map(x=>`<a class="product" href="/product.html?id=${encodeURIComponent(x.id)}"><div class="productImg"><img src="${esc(x.image||fallback)}" alt="${esc(x.name)}"></div><div class="productInfo"><div class="brand">${esc(x.brand||'6PACKWEAR')}</div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.category||'')} ${x.color?'· '+esc(x.color):''}</div><div class="price"><span>$${Number(x.price||0).toFixed(2)}</span><span class="meta">${x.stock>0?'IN STOCK':'OUT OF STOCK'}</span></div></div></a>`).join('')||'<div class="card"><div class="cardTitle">No products found</div><div class="cardMeta">Add products to the 6PACKWEAR catalog and they will appear here automatically.</div></div>'}search.oninput=render;load();</script></body></html>
