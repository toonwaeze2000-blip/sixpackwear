<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Product</title><style>:root{--bg:#050505;--text:#f4f4f0;--muted:#888;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;background:rgba(5,5,5,.94);backdrop-filter:blur(8px);z-index:5}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo span{font-weight:300;color:#aaa}.nav{display:flex;gap:28px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.wrap{max-width:1400px;margin:auto;padding:55px 34px 90px}.back{display:inline-block;color:#888;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:24px}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:52px}.productImage{background:#111;aspect-ratio:3/4;overflow:hidden}.productImage img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}.kicker{font-size:10px;color:#777;letter-spacing:.24em;text-transform:uppercase}.productInfo h1{font-size:clamp(44px,6vw,82px);line-height:.88;letter-spacing:-.06em;text-transform:uppercase;margin:11px 0 12px}.brand{color:#aaa;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.price{font-size:28px;margin:28px 0}.desc{color:#aaa;line-height:1.6;max-width:560px;font-size:13px}.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.sizes button{min-width:52px;background:none;color:#fff;border:1px solid #444;padding:11px 14px;cursor:pointer}.sizes button.active,.sizes button:hover{background:#fff;color:#000}.add{width:100%;padding:16px;background:#f0f0eb;border:0;color:#050505;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.status{margin-top:14px;color:#777;font-size:10px}@media(max-width:800px){.product{grid-template-columns:1fr}.nav{display:none}.wrap{padding:40px 16px 60px}}</style></head><body><header><a class="logo" href="/">6PACK<span>WEAR</span></a><nav class="nav"><a href="/catalog.html?view=looks">Looks</a><a href="/catalog.html?view=categories">Categories</a><a href="/catalog.html?view=brands">Brands</a><a href="/catalog.html?view=newdrops">New Drops</a></nav></header><main class="wrap"><a class="back" href="/catalog.html">← Back to catalog</a><div id="app">Loading product…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://boaqzdyfsosswqvjgsjn.supabase.co';const SUPABASE_KEY='sb_publishable_JlneB01f5LDJ4VBO_n1E7Q_jXn5JBky';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const id=new URLSearchParams(location.search).get('id');const fallback='/assets/d2060b27-276c-44c6-89d1-860f5908fb0b.png';async function init(){const app=document.getElementById('app');if(!id){app.innerHTML='<div class="status">Product not found.</div>';return}const {data:p,error}=await db.from('products').select('*').eq('id',id).single();if(error||!p){app.innerHTML='<div class="status">Product not found or unavailable.</div>';return}const sizes=Array.isArray(p.sizes)?p.sizes:[];app.innerHTML=`<section class="product"><div class="productImage"><img src="${esc(p.image||fallback)}" alt="${esc(p.name)}"></div><div class="productInfo"><div class="kicker">${esc(p.category||'6PACKWEAR')}</div><div class="brand">${esc(p.brand||'Independent')}</div><h1>${esc(p.name)}</h1><div class="price">$${Number(p.price||0).toFixed(2)}</div><div class="desc">${esc(p.style||'Selected piece from the 6PACKWEAR catalog.')}</div>${sizes.length?`<div class="sizes">${sizes.map((s,i)=>`<button class="${i===0?'active':''}" data-size="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}<button class="add" id="add">Add to bag</button><div class="status">${p.stock>0?`${p.stock} in stock`:'Out of stock'}</div></div></section>`;document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('add').onclick=()=>{const size=document.querySelector('[data-size].active')?.dataset.size||'';localStorage.setItem('sixpack_last_product',JSON.stringify({id:p.id,size}));document.getElementById('add').textContent='Added to bag'};}init();</script></body></html>
