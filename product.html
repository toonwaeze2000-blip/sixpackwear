<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Product</title><style>:root{--bg:#050505;--panel:#0b0b0b;--text:#f4f4f0;--muted:#888;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;background:rgba(5,5,5,.96);backdrop-filter:blur(8px);z-index:5}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo span{font-weight:300;color:#aaa}.nav{display:flex;gap:28px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.wrap{max-width:1400px;margin:auto;padding:55px 34px 90px}.back{display:inline-block;color:#888;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:24px}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:52px}.productImage{background:#111;aspect-ratio:3/4;overflow:hidden}.productImage img{width:100%;height:100%;object-fit:cover;filter:grayscale(.12)}.kicker{font-size:10px;color:#777;letter-spacing:.24em;text-transform:uppercase}.productInfo h1{font-size:clamp(44px,6vw,82px);line-height:.88;letter-spacing:-.06em;text-transform:uppercase;margin:11px 0 12px}.brand{color:#aaa;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.price{font-size:28px;margin:28px 0}.desc{color:#aaa;line-height:1.6;max-width:560px;font-size:13px}.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.sizes button{min-width:52px;background:none;color:#fff;border:1px solid #444;padding:11px 14px;cursor:pointer}.sizes button.active,.sizes button:hover{background:#fff;color:#000}.add{width:100%;padding:16px;background:#f0f0eb;border:0;color:#050505;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.status{margin-top:14px;color:#777;font-size:10px}.complete{margin-top:100px;border-top:1px solid var(--line);padding-top:38px}.completeHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.completeHead h2{font-size:clamp(32px,4vw,58px);line-height:.9;letter-spacing:-.06em;text-transform:uppercase;margin:0}.completeHead p{margin:0;color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.14em}.lookGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.lookItem{background:var(--panel);border:1px solid #202020;min-width:0}.lookImage{aspect-ratio:3/4;background:#111;overflow:hidden;position:relative}.lookImage img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}.lookItem:hover img{transform:scale(1.035)}.lookBody{padding:13px}.lookType{font-size:8px;color:#777;text-transform:uppercase;letter-spacing:.16em}.lookName{font-size:13px;margin:6px 0;line-height:1.3}.lookPrice{font-size:11px;font-weight:700}.lookLink{display:block;border-top:1px solid #242424;margin-top:12px;padding-top:11px;color:#aaa;font-size:8px;text-transform:uppercase;letter-spacing:.13em}.lookLink:hover{color:#fff}@media(max-width:800px){.product{grid-template-columns:1fr}.nav{display:none}.wrap{padding:40px 16px 60px}.complete{margin-top:65px}.lookGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.lookGrid{grid-template-columns:1fr 1fr}.lookName{font-size:11px}}</style></head><body><header><a class="logo" href="/">6PACK<span>WEAR</span></a><nav class="nav"><a href="/catalog.html?view=shop&category=T-Shirts">T-Shirts</a><a href="/catalog.html?view=shop&category=Pants">Pants</a><a href="/catalog.html?view=shop&category=Shorts">Shorts</a><a href="/catalog.html?view=shop&category=Sneakers">Sneakers</a><a href="/catalog.html?view=looks">Looks</a></nav></header><main class="wrap"><a class="back" href="/catalog.html">← Back to catalog</a><div id="app">Loading product…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/cart.js"></script><script>const SUPABASE_URL='https://boaqzdyfsosswqvjgsjn.supabase.co';const SUPABASE_KEY='sb_publishable_JlneB01f5LDJ4VBO_n1E7Q_jXn5JBky';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const id=new URLSearchParams(location.search).get('id');const fallback='/assets/d2060b27-276c-44c6-89d1-860f5908fb0b.png';const cat=s=>String(s||'').toLowerCase();function pick(arr,tests,exclude,used){return arr.find(p=>p.id!==exclude&&!used.has(p.id)&&tests.some(t=>t.test(cat(p.category)+' '+cat(p.style)+' '+cat(p.name))))}function productCard(p,label){return `<article class="lookItem"><a href="/product.html?id=${encodeURIComponent(p.id)}"><div class="lookImage"><img src="${esc(p.image||fallback)}" alt="${esc(p.name)}" loading="lazy"></div><div class="lookBody"><div class="lookType">${esc(label||p.category||'Menswear')}</div><div class="lookName">${esc(p.brand||'6PACKWEAR')} · ${esc(p.name)}</div><div class="lookPrice">$${Number(p.price||0).toFixed(2)}</div><span class="lookLink">View item →</span></div></a></article>`}async function init(){const app=document.getElementById('app');if(!id){app.innerHTML='<div class="status">Product not found.</div>';return}const {data:p,error}=await db.from('products').select('*').eq('id',id).single();if(error||!p){app.innerHTML='<div class="status">Product not found or unavailable.</div>';return}const {data:all}=await db.from('products').select('id,name,brand,category,style,price,stock,sizes,color,image,created_at').neq('id',id).order('created_at',{ascending:false});const products=all||[];const sizes=Array.isArray(p.sizes)?p.sizes:[];const base=cat(p.category+' '+p.name+' '+p.style);const isTop=/t-shirt|tee|shirt|hoodie|sweat/i.test(base);const isBottom=/pant|trouser|jean|short/i.test(base);const isShoe=/sneaker|shoe|trainer|boot/i.test(base);let picks=[];const used=new Set([p.id]);const add=(tests,label)=>{const x=pick(products,tests,id,used);if(x){used.add(x.id);picks.push({p:x,label})}};if(isTop){add([/pant|trouser|jean/],'PANTS');add([/short/],'SHORTS');add([/sneaker|shoe|trainer/],'SNEAKERS');add([/jacket|outerwear|overshirt/],'LAYER')}else if(isBottom){add([/t-shirt|tee|shirt/],'T-SHIRT');add([/hoodie|sweat/],'HOODIE');add([/sneaker|shoe|trainer/],'SNEAKERS');add([/jacket|outerwear/],'LAYER')}else if(isShoe){add([/t-shirt|tee|shirt/],'T-SHIRT');add([/pant|trouser|jean/],'PANTS');add([/short/],'SHORTS');add([/hoodie|jacket|outerwear/],'LAYER')}else{add([/t-shirt|tee|shirt/],'T-SHIRT');add([/pant|trouser|jean/],'PANTS');add([/short/],'SHORTS');add([/sneaker|shoe|trainer/],'SNEAKERS')}app.innerHTML=`<section class="product"><div class="productImage"><img src="${esc(p.image||fallback)}" alt="${esc(p.name)}"></div><div class="productInfo"><div class="kicker">MEN'S · ${esc(p.category||'Menswear')}</div><div class="brand">${esc(p.brand||'Independent')}</div><h1>${esc(p.name)}</h1><div class="price">$${Number(p.price||0).toFixed(2)}</div><div class="desc">${esc(p.style||'Selected piece from the 6PACKWEAR menswear catalog.')}</div>${sizes.length?`<div class="sizes">${sizes.map((s,i)=>`<button class="${i===0?'active':''}" data-size="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}<button class="add" id="add" ${p.stock>0?'':'disabled'}>${p.stock>0?'Add to bag':'Out of stock'}</button><div class="status">${p.stock>0?`${p.stock} in stock · Men's collection`:'Out of stock'}</div></div></section>${picks.length?`<section class="complete"><div class="completeHead"><h2>Complete<br>the look</h2><p>Build your men's outfit</p></div><div class="lookGrid">${picks.map(x=>productCard(x.p,x.label)).join('')}</div></section>`:''}`;document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('add').onclick=async()=>{if(!p.stock)return;const size=document.querySelector('[data-size].active')?.dataset.size||'';try{const r=await window.sixpackCart.addToCart(p,size,1);document.getElementById('add').textContent='Added to bag';if(r.guest)document.getElementById('add').title='Saved on this device. Sign in to sync your cart across devices.'}catch(err){document.getElementById('add').textContent='Unable to add';console.error(err)}}}init();</script></body></html>
