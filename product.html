<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6PACKWEAR — Product</title><style>:root{--bg:#050505;--panel:#0d0d0d;--text:#f4f4f0;--muted:#888;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 34px;position:sticky;top:0;background:#070707;z-index:50}.logo{font-size:24px;font-weight:900;letter-spacing:-.08em}.men{height:76px;display:flex;align-items:center;padding:0 24px;background:#f4f4f0;color:#050505;font-size:10px;font-weight:900;letter-spacing:.16em}.search{flex:1;max-width:680px}.search input{width:100%;height:42px;border:0;border-radius:24px;padding:0 18px;background:#eee;color:#111}.actions{margin-left:auto;display:flex;gap:17px}.actions button{background:none;border:0;color:#fff;font-size:9px;text-transform:uppercase;letter-spacing:.12em;cursor:pointer}.nav{height:52px;background:#202020;border-bottom:1px solid #393939;display:flex;justify-content:center;position:sticky;top:76px;z-index:40}.nav button{border:0;background:none;color:#eee;padding:0 19px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.nav button:hover{background:#f4f4f0;color:#111}.wrap{max-width:1450px;margin:auto;padding:32px 34px 100px}.back{color:#777;font-size:9px;letter-spacing:.15em;text-transform:uppercase}.product{display:grid;grid-template-columns:1.08fr .92fr;gap:55px;margin-top:30px}.photo{aspect-ratio:4/5;background:#111;border:1px solid #202020;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.info{padding-top:8px;position:sticky;top:150px;align-self:start}.brand{font-size:10px;color:#aaa;letter-spacing:.17em;text-transform:uppercase}.info h1{font-size:clamp(42px,5.8vw,82px);line-height:.86;letter-spacing:-.07em;text-transform:uppercase;margin:10px 0}.price{font-size:25px;font-weight:700;margin:25px 0}.desc{color:#999;font-size:13px;line-height:1.6;max-width:570px}.box{margin:25px 0;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.detail{padding:13px;border:1px solid #1d1d1d}.detail b{display:block;color:#777;font-size:8px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}.detail span{font-size:11px}.sizeTitle{display:flex;justify-content:space-between;margin:24px 0 9px;font-size:9px;text-transform:uppercase;letter-spacing:.13em}.sizeTitle span{color:#777}.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sizes button{height:46px;background:#090909;border:1px solid #414141;color:#fff;cursor:pointer}.sizes button:hover,.sizes button.active{background:#f4f4f0;color:#050505;border-color:#f4f4f0}.sizes button:disabled{opacity:.28;text-decoration:line-through;cursor:not-allowed}.add{width:100%;height:54px;margin-top:13px;border:0;background:#f4f4f0;color:#050505;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.add:disabled{opacity:.35;cursor:not-allowed}.save{width:100%;height:45px;margin-top:8px;background:#090909;border:1px solid #3a3a3a;color:#fff;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.status{margin-top:12px;color:#777;font-size:9px;letter-spacing:.1em;text-transform:uppercase}.complete{margin-top:95px;border-top:1px solid var(--line);padding-top:40px}.complete h2{font-size:clamp(42px,5vw,70px);line-height:.82;letter-spacing:-.07em;text-transform:uppercase;margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel);border:1px solid #202020}.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.card div{padding:12px}.small{font-size:8px;color:#777;text-transform:uppercase;letter-spacing:.13em}.name{font-size:12px;margin-top:6px}.card .price{font-size:11px;margin:8px 0}.error{padding:100px 0;color:#888}.toast{position:fixed;right:20px;bottom:20px;background:#f4f4f0;color:#050505;padding:14px 18px;font-size:10px;font-weight:800;letter-spacing:.1em;transform:translateY(90px);transition:.2s;z-index:100}.toast.show{transform:none}@media(max-width:900px){.product{grid-template-columns:1fr}.info{position:static}.grid{grid-template-columns:repeat(2,1fr)}.men{display:none}.search{display:none}.nav{overflow:auto;justify-content:flex-start}.nav button{white-space:nowrap}}@media(max-width:520px){.top{padding:0 14px}.actions{gap:8px}.wrap{padding:24px 13px 70px}.product{gap:28px}.sizes{grid-template-columns:repeat(2,1fr)}.box{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><a class="logo" href="/">6PACKWEAR</a><div class="men">MEN</div><div class="search"><input id="search" placeholder="Search men's items and brands"></div><div class="actions"><button onclick="location.href='/catalog.html?view=saved'">Saved ♡</button><button onclick="location.href='/cart.html'">Bag <span id="bagCount">0</span></button></div></header><nav class="nav"><button onclick="location.href='/catalog.html?view=newdrops'">New In</button><button onclick="location.href='/catalog.html?view=shop&category=T-Shirts'">Clothing</button><button onclick="location.href='/catalog.html?view=shop&category=Sneakers'">Shoes</button><button onclick="location.href='/catalog.html?view=shop&category=Accessories'">Accessories</button><button onclick="location.href='/catalog.html?view=brands'">Brands</button><button onclick="location.href='/catalog.html?view=shop&category=Sport'">Activewear</button><button onclick="location.href='/catalog.html?view=looks'">Looks</button></nav><main class="wrap"><a class="back" href="/catalog.html">← Back to men's shop</a><div id="app"><div class="error">Loading product…</div></div></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/cart.js?v=20260907-5"></script><script>const URL='https://boaqzdyfsosswqvjgsjn.supabase.co',KEY='sb_publishable_JlneB01f5LDJ4VBO_n1E7Q_jXn5JBky',db=window.supabase.createClient(URL,KEY),id=new URLSearchParams(location.search).get('id'),fallback='/assets/d2060b27-276c-44c6-89d1-860f5908fb0b.png',esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),money=n=>'$'+Number(n||0).toFixed(2),savedIds=()=>{try{return JSON.parse(localStorage.getItem('6pw-saved')||'[]')}catch{return[]}},toast=t=>{const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)};function available(stock,s){return Number(stock[s]||0)>0}function card(p){return `<a class="card" href="/product.html?id=${encodeURIComponent(p.id)}"><img src="${esc(p.image||fallback)}" loading="lazy"><div><div class="small">${esc(p.brand||'6PACKWEAR')}</div><div class="name">${esc(p.name)}</div><div class="price">${money(p.price)}</div></div></a>`}async function init(){const app=document.getElementById('app');if(!id){app.innerHTML='<div class="error">Product not found.</div>';return}try{const [pr,inv,rel]=await Promise.all([db.from('products').select('*').eq('id',id).single(),db.from('product_inventory').select('size,stock,reserved').eq('product_id',id),db.from('products').select('id,name,brand,category,price,image,created_at').neq('id',id).order('created_at',{ascending:false}).limit(12)]);if(pr.error||!pr.data)throw new Error('PRODUCT_NOT_FOUND');const p=pr.data,rows=inv.data||[],stock={};rows.forEach(x=>stock[x.size]=Math.max(0,Number(x.stock||0)-Number(x.reserved||0)));let sizes=Array.isArray(p.sizes)?p.sizes:[];if(!sizes.length)sizes=Object.keys(stock);const liveTotal=Object.values(stock).reduce((a,b)=>a+b,0),out=liveTotal<=0,related=(rel.data||[]).filter(x=>!/(women|woman|womens|female|ladies|girls)/i.test([x.name,x.category,x.brand].join(' '))).slice(0,8);app.innerHTML=`<section class="product"><div class="photo"><img src="${esc(p.image||fallback)}" alt="${esc(p.name)}"></div><div class="info"><div class="brand">${esc(p.brand||'6PACKWEAR')}</div><h1>${esc(p.name)}</h1><div class="price">${money(p.price)}</div><div class="desc">${esc(p.description||p.style||'Selected piece from the 6PACKWEAR men’s collection.')}</div><div class="box"><div class="detail"><b>Category</b><span>${esc(p.category||'Menswear')}</span></div><div class="detail"><b>Colour</b><span>${esc(p.color||'Core')}</span></div><div class="detail"><b>Fit</b><span>${esc(p.style||'Regular')}</span></div><div class="detail"><b>Availability</b><span>${out?'Out of stock':liveTotal+' available'}</span></div></div><div class="sizeTitle"><b>Select size</b><span id="sizeHint">${out?'Currently unavailable':'Choose a size'}</span></div><div class="sizes" id="sizes">${sizes.map(s=>`<button type="button" data-size="${esc(s)}" ${available(stock,s)?'':'disabled'}>${esc(s)}</button>`).join('')}</div><button class="add" id="add" disabled>${out?'Out of stock':'Select a size'}</button><button class="save" id="save">♡ Save item</button><div class="status">${out?'No sizes currently available':liveTotal+' units available across sizes'}</div></div></section>${related.length?`<section class="complete"><h2>Complete the look</h2><div class="grid">${related.map(card).join('')}</div></section>`:''}`;let selected='';const btns=[...document.querySelectorAll('[data-size]')];btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=b.dataset.size;document.getElementById('sizeHint').textContent=stock[selected]+' available';document.getElementById('add').disabled=false;document.getElementById('add').textContent='Add to bag'});document.getElementById('add').onclick=async()=>{const b=document.getElementById('add');if(!selected)return;b.disabled=true;b.textContent='Adding…';try{await window.sixpackCart.addToCart({...p,size_stock:stock,stock:liveTotal},selected,1);b.textContent='Added to bag';document.getElementById('bagCount').textContent=Number(document.getElementById('bagCount').textContent||0)+1;toast('Added: '+p.name+' · '+selected)}catch(e){b.disabled=false;b.textContent='Try again';toast('This size is no longer available')}};document.getElementById('save').onclick=()=>{const a=savedIds(),has=a.map(String).includes(String(p.id)),next=has?a.filter(x=>String(x)!==String(p.id)):[...a,p.id];localStorage.setItem('6pw-saved',JSON.stringify(next));document.getElementById('save').textContent=has?'♡ Save item':'♥ Saved';toast(has?'Removed from saved':'Saved for later')} }catch(e){console.error(e);app.innerHTML='<div class="error">Could not load this product. <a href="/catalog.html" style="text-decoration:underline">Back to shop →</a></div>'}}init();document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())location.href='/catalog.html?view=search&q='+encodeURIComponent(e.target.value.trim())};</script></body></html>
